{% extends "agency/base.html" %}

{% block title %}Регистрация{% endblock %}

{% block content %}
    <section>
        <h2>Регистрация клиента</h2>
        <form method="post">
            {% csrf_token %}
            <fieldset>
                <legend>Форма регистрации</legend>
                {{ form.as_p }}
            </fieldset>
            <p><button type="submit">Зарегистрироваться</button></p>
        </form>
    </section>
{% endblock %}
