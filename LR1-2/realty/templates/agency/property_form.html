{% extends "agency/base.html" %}

{% block title %}Форма объекта{% endblock %}

{% block content %}
    <section>
        <h2>Объект недвижимости</h2>
        <form method="post">
            {% csrf_token %}
            <fieldset>
                <legend>Форма объекта</legend>
                {{ form.as_p }}
            </fieldset>
            <p><button type="submit">Сохранить</button></p>
        </form>
    </section>
{% endblock %}
