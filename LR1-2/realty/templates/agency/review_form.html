{% extends "agency/base.html" %}

{% block title %}Добавить отзыв{% endblock %}

{% block content %}
    <section>
        <h2>Новый отзыв</h2>
        <form method="post">
            {% csrf_token %}
            <fieldset>
                <legend>Форма отзыва</legend>
                {{ form.as_p }}
            </fieldset>
            <p><button type="submit">Отправить</button></p>
        </form>
    </section>
{% endblock %}
